---

- name: Install Samba # noqa fqcn[action-core]
  ansible.builtin.yum:
    state: present
    name: samba

- name: Configure Samba for backend scanning shares
  ansible.builtin.template:
    src: templates/smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: '0644'

  notify:
    - Restart Samba service
